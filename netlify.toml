[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Le relais OpenRouter. La clé API vit uniquement dans l'environnement Netlify ;
# elle n'est jamais servie au navigateur.
#
# La fonction déclare elle-même sa route (`export const config = { path: … }`,
# API v2) : il ne faut surtout PAS ajouter de redirection vers
# /.netlify/functions/dialogue, qui n'existe pas pour une fonction à route
# déclarée — la redirection masquerait la vraie route et renverrait un 404.
[functions]
  directory = "netlify/functions"

# Le site utilise un routeur à # : une seule page réelle suffit.
# Cette règle couvre néanmoins les accès directs à un chemin.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
